on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'configure'
      - 'configure.win'
      - 'DESCRIPTION'
      - '.github/workflows/cran-vendor.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'configure'
      - 'configure.win'
      - 'DESCRIPTION'
      - '.github/workflows/cran-vendor.yaml'
  workflow_dispatch:

name: cran-vendor.yaml

permissions: read-all

jobs:
  vendored-offline-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_LIMIT_CORES_: 'TRUE'

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Vendor the Rust dependencies
        run: ./tools/vendor.sh

      - name: Build and check with the network disabled
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--ignore-vignettes"),
            build_args = c("--no-build-vignettes", "--no-manual"),
            error_on = "error",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vendored-offline-check-results
          path: check

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'configure'
      - 'configure.win'
      - 'DESCRIPTION'
      - '.github/workflows/cran-vendor.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'configure'
      - 'configure.win'
      - 'DESCRIPTION'
      - '.github/workflows/cran-vendor.yaml'
  workflow_dispatch:

name: cran-vendor.yaml

permissions: read-all

jobs:
  vendored-offline-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_LIMIT_CORES_: 'TRUE'

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Vendor the Rust dependencies
        run: ./tools/vendor.sh

      # The Windows job below consumes this archive rather than producing its own,
      # which is also the arrangement a CRAN release has: the maintainer runs
      # tools/vendor.sh on Unix and the archive travels inside the source tarball,
      # so no Windows machine ever writes one. Producing it here would additionally
      # rest on the runner's tar being able to compress xz, which is not something
      # the package needs of Windows. The archive is a hand-off between two jobs of
      # one run and is worth nothing afterwards, hence the short retention.
      - name: Upload the vendored archive
        uses: actions/upload-artifact@v7
        with:
          name: vendored-sources
          path: src/rust/vendor.tar.xz
          retention-days: 1

      - name: Build and check with the network disabled
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--ignore-vignettes"),
            build_args = c("--no-build-vignettes", "--no-manual"),
            error_on = "error",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vendored-offline-check-results
          path: check

  # The job above proves the vendored archive builds offline on Unix only. The
  # Windows makefile template is separate code with its own handling of the
  # archive, so a passing Unix job says nothing about whether a CRAN Windows build
  # reads the vendored crates or reaches for crates.io. This job is what says it.
  #
  # Install only, no check: extracting the archive and pointing cargo at it either
  # works or the compile fails, and a check would add minutes to learn nothing
  # further about vendoring.
  #
  # Depending on the whole Unix job, rather than only on the archive it uploads, is
  # deliberate. When the Unix offline build fails the archive itself is in doubt,
  # and a Windows result read against a suspect archive says nothing.
  windows-vendored-offline-install:
    runs-on: windows-latest

    needs: vendored-offline-check

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      # src/rust is where Makevars.win looks for the archive, so the download
      # leaves it exactly where an unpacked CRAN tarball would have it.
      - name: Download the vendored archive
        uses: actions/download-artifact@v7
        with:
          name: vendored-sources
          path: src/rust

      - name: Install with the network disabled
        env:
          CARGO_NET_OFFLINE: 'true'
        shell: bash
        run: |
          # Fail on a missing archive here rather than letting the compile fail,
          # so that an artifact that never arrived cannot be mistaken for a build
          # that ignored an archive which was present. Both would otherwise show
          # up as cargo trying to reach the network.
          if [ ! -f src/rust/vendor.tar.xz ]; then
            echo "src/rust/vendor.tar.xz is missing, so nothing here tests the vendored path" >&2
            exit 1
          fi

          # An install from the checkout rather than from a source tarball. The
          # checkout is short enough that the cargo target directory stays inside
          # the package, so nothing in the log is about relocating that directory
          # and everything in it is about where cargo resolved its dependencies
          # from. Which of the two the target directory does has no bearing on
          # that question; the deep-path job in R-CMD-check.yaml covers the other
          # one.
          #
          # CARGO_NET_OFFLINE is what makes this a test: without the vendored
          # crates in place cargo has to reach crates.io, and offline it fails
          # there instead of quietly succeeding on a warm registry cache.
          R CMD INSTALL .

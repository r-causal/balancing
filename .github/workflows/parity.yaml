on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

name: parity.yaml

permissions: read-all

jobs:
  parity:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::WeightIt, any::optweight
          needs: check

      - name: Run parity tests against WeightIt and optweight
        run: devtools::test(filter = "method-", stop_on_failure = TRUE)
        shell: Rscript {0}

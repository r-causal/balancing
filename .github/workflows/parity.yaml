on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

name: parity.yaml

permissions:
  contents: read
  issues: write

jobs:
  parity:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::WeightIt, any::optweight
          needs: check

      - name: Run parity tests against WeightIt and optweight
        run: devtools::test(filter = "method-", stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Open an issue on parity drift
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Parity drift detected in scheduled run ${{ github.run_id }}" \
            --body "The scheduled parity job failed, which signals that the golden comparisons no longer match current CRAN WeightIt or optweight. This usually means an upstream release changed behavior. Review the run at ${RUN_URL} and update the fixtures or the reference expectations as needed."

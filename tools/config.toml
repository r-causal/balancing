# Copied to src/.cargo/config.toml by the Makevars recipe when the vendored source
# archive is present, so that cargo resolves the locked dependencies from the
# extracted directory instead of from crates.io.
#
# src/.cargo, and not src/rust/.cargo beside the workspace manifest, because cargo
# looks for a config file by walking up from its working directory and never from
# the manifest that --manifest-path names. make runs the recipe in src, so a config
# file written under src/rust is never read.
#
# The directory below is relative to src, the directory holding the .cargo
# directory this file is copied into. That is how cargo resolves a relative path in
# a config file, whichever directory cargo was invoked from.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "rust/vendor"

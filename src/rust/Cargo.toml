[workspace]
resolver = "3"
members = ["crates/core", "crates/savvy"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.0.0"

# Shared dependency versions. Crates opt in with `{ workspace = true }` so a
# single line governs the version across the whole tree.
[workspace.dependencies]
savvy = "0.10.2"
rayon = "1"
osqp = "1"
clarabel = "0.11"
basin = "1"
# Dense linear algebra. Only the small k x k factorizations run through faer, so
# rayon is left off: the deterministic reductions own all data parallelism.
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }

# Release profile. `panic = "unwind"` is required: savvy converts a Rust panic
# into an R error, which is only possible when panics unwind rather than abort.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
